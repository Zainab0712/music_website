<!DOCTYPE htm<i class="bi bi-play-fill"></i></i>l>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="brand-block">
                <p class="brand">Tangerine Music</p>
                <p class="subtitle">When life gives you tangerines</p>
            </div>

              <div class="upload-card">
            <p>Bring your own song</p>
            <label for="fileInput" class="btn"  >Add local Music</label>
            <input type="file" name="" id="fileInput" accept="audio/*" multiple  hidden>
        </div>

        <ul class="playlist"  id="playlist">
                <li class="playlist-item" ></li>
        </ul>

   </div>

        <main class="player-panel" >
            <div class="now-playing" >
                <div class="cover-art" id="coverart"></div>
                <div class="track-meta" >
                    <p class="eye"> Now Playing </p>
                    <h1 id="tracktitle">Select a track</h1>
                    <p id="trackartist">Choose from playlist to begin</p>
                </div>
            </div>

            
                <div class="controls" >
                    <button class="icon-btn" id="previousbtn"><i class="bi bi-rewind-btn"></i></button>
                    <button class="play-Btn" id="playbtn"></button>
                    <button class="icon-btn"  id="nextbtn"><i class="bi bi-fast-forward-btn"></i></i></i></button>
                </div>
                <div class="timeline" >
                    <span  id="currenttime">0:00</span>
                    <input type="range" min="0" max="100" value="0" step="0.1" id="progress" >
                    <span id="duration">0:00</span>
                </div>


                <div class="bottom-row">
                    <div class="toggle-group">
                      <button class="toggle-btn" id="shufflebtn"><i class="bi bi-shuffle"></i></button>
                      <button class="toggle-btn" id="repeatbtn"><i class="bi bi-repeat"></i></button>
                    </div>
                    <div class="volume">
                        <span><i class="bi bi-volume-up-fill"></i></span>
                        <input type="range" name="" id="volume" min="0" max="100"
                         step="1" value="100">     
                    </div>
                </div>
        </main>
    </div>

    <audio src=" " id="audio" preload="metadata"></audio>


    <!-- <script src="./volume.js"></script> -->
    <script src="./script.js"></script>
</body>
</html>
